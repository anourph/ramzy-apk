<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل البيانات</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302e;--mute:#5f7773;--line:#d7e2df;--acc:#1f7a6d;--acc2:#16594f;--danger:#b8452f;--field:#f6faf9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b1a;--card:#152826;--ink:#e6f1ef;--mute:#8fa9a5;--line:#244240;--acc:#3fb5a3;--acc2:#2f9686;--danger:#e0705a;--field:#102220;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.6;padding:24px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;margin:0;font-weight:700}
.count{background:var(--acc);color:#fff;border-radius:16px;padding:10px 22px;text-align:center;min-width:120px}
.count b{display:block;font-size:34px;line-height:1.1}
.count span{font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 18px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button.link{border:0;background:none;color:var(--acc);padding:4px 8px}
button.del{color:var(--danger)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input{max-width:280px}
.sp{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:14px;white-space:nowrap}
tr.editing td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 14px;font-size:14px;background:var(--field)}
.chip.ok{color:var(--acc);border-color:var(--acc)}
.chip.warn{color:var(--danger);border-color:var(--danger)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 8px;font-size:20px}
</style>
<!-- إضافة أداة الذكاء الاصطناعي لقراءة الصور -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>تسجيل البيانات</h1>
    <div class="sync"><button class="chip" id="syncBtn" type="button"></button><button class="link" id="cfgBtn" type="button">الربط بجوجل شيت</button></div>
    <div class="count"><b id="cnt">0</b><span>سجل محفوظ</span></div>
  </header>

  <form class="card" id="form" onsubmit="return false">
    <div class="grid" id="fields"></div>
    <div class="actions">
      <button class="pri" id="saveBtn" type="button">إضافة</button>
      
      <!-- زر تصوير الورقة الجديد -->
      <button class="pri" id="scanBtn" type="button" style="background:var(--acc2); margin-right:8px;">تصوير ورقة</button>
      <input id="scanInput" type="file" accept="image/*" capture="environment" style="display:none">

      <button id="cancelBtn" type="button" style="display:none">إلغاء التعديل</button>
      <span class="sp"></span>
      <button class="link" id="colsBtn" type="button">تعديل أسماء الأعمدة</button>
    </div>
  </form>

  <div class="card">
    <div class="bar">
      <input id="q" type="search" placeholder="بحث...">
      <span class="sp"></span>
      <button class="pri" id="xlsBtn" type="button">تصدير إلى Excel</button>
      <button id="impBtn" type="button">استيراد من Excel</button>
      <input id="file" type="file" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
    <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <p class="hint">البيانات بتتحفظ على الجهاز، ولما تربط بجوجل شيت بتتزامن بين اللابتوب والموبايل. لو النت فاصل، السجلات بتستنى وتتبعت لوحدها بعدين.</p>
  </div>
</div>
<dialog id="dlg">
  <h2>الربط بجوجل شيت</h2>
  <p class="hint">الصق هنا رابط الـ Web App اللي بينتهي بـ /exec (الخطوات في ملف «اقرأني-أولاً»). ما تشاركش الرابط مع حد.</p>
  <label for="url" style="margin-top:12px">رابط Apps Script</label>
  <input id="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="actions"><button class="pri" id="urlSave" type="button">حفظ وربط</button><button id="urlOff" type="button">فصل الربط</button><span class="sp"></span><button id="urlClose" type="button">إغلاق</button></div>
</dialog>
<div class="toast" id="toast"></div>

<!-- 
===========================================================
ملاحظة هامة: ضع هنا كود مكتبة xlsx.js الطويل الخاص بك 
الذي يبدأ بـ <script>/*! xlsx.js (C) 2013-present 
من ملفك القديم كما هو هنا لتشغيل تصدير الإكسيل
===========================================================
-->

<script>
(function(){
var KEY="dataEntryApp.v1",CFG="dataEntryApp.cfg",QK="dataEntryApp.queue";
var DEF_COLS=["الاسم","رقم الموبايل","الرقم / المبلغ","ملاحظات"];
var cols=DEF_COLS.slice(),rows=[],editingId=null,url="",queue=[],busy=false,offline=false;
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function idx(id){for(var i=0;i<rows.length;i++)if(rows[i]._id===id)return i;return -1}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){cols=d.cols||cols;rows=d.rows||[]}
  url=localStorage.getItem(CFG)||"";queue=JSON.parse(localStorage.getItem(QK)||"[]")}catch(e){}
  rows.forEach(function(r){if(!r._id)r._id=uid()});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cols:cols,rows:rows}));localStorage.setItem(QK,JSON.stringify(queue))}catch(e){toast("تعذر الحفظ على الجهاز")}}
function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},2600)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setStatus(){
  var b=$("syncBtn");
  if(!url){b.textContent="غير مربوط بجوجل شيت";b.className="chip";return}
  if(busy){b.textContent="جاري المزامنة...";b.className="chip";return}
  if(queue.length||offline){b.textContent=queue.length?queue.length+" سجل في الانتظار — اضغط للمزامنة":"مفيش اتصال — اضغط للمحاولة";b.className="chip warn";return}
  b.textContent="متزامن مع الشيت ✓";b.className="chip ok";
}
function post(op){
  var body=JSON.stringify(Object.assign({cols:cols},op));
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
    .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"error");return j});
}
function flush(){
  if(!url||busy||!queue.length)return Promise.resolve();
  busy=true;setStatus();
  function next(){
    if(!queue.length){busy=false;offline=false;setStatus();return Promise.resolve()}
    return post(queue[0]).then(function(){queue.shift();save();return next()});
  }
  return next().catch(function(){busy=false;offline=true;setStatus()});
}
function pull(){
  if(!url)return Promise.resolve();
  return flush().then(function(){
    if(queue.length||busy)return;
    return fetch(url).then(function(r){return r.json()}).then(function(j){
      if(!j.ok)throw 0;
      var old=cols.join("|");
      if(j.cols&&j.cols.length)cols=j.cols;
      rows=j.rows||[];
      save();
      if(old!==cols.join("|")){buildForm();clearForm()}
      else if(editingId&&idx(editingId)<0)clearForm();
      offline=false;setStatus();render();
    });
  }).catch(function(){offline=true;setStatus()});
}
function buildForm(){
  var h="";
  cols.forEach(function(c,i){
    var long=/ملاحظ|وصف|note/i.test(c);
    h+='<div><label for="f'+i+'">'+esc(c)+'</label>'+(long?'<textarea rows="1" id="f'+i+'"></textarea>':'<input id="f'+i+'" autocomplete="off">')+'</div>';
  });
  $("fields").innerHTML=h;
  $("fields").onkeydown=function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();var n=e.target.parentNode.nextSibling;if(n)n.querySelector("input,textarea").focus();else doSave()}};
}
function render(){
  var q=$("q").value.trim().toLowerCase();
  $("thead").innerHTML="<tr><th>#</th>"+cols.map(function(c){return"<th>"+esc(c)+"</th>"}).join("")+"<th></th></tr>";
  var h="";
  rows.forEach(function(r,i){
    if(q&&!cols.some(function(c){return String(r[c]==null?"":r[c]).toLowerCase().indexOf(q)>-1}))return;
    h+='<tr'+(r._id===editingId?' class="editing"':'')+'><td>'+(i+1)+'</td>'+cols.map(function(c){return"<td>"+esc(r[c])+"</td>"}).join("")+
      '<td style="white-space:nowrap"><button class="link" data-e="'+r._id+'">تعديل</button><button class="link del" data-d="'+r._id+'">حذف</button></td></tr>';
  });
  $("tbody").innerHTML=h||'<tr><td class="empty" colspan="'+(cols.length+2)+'">'+(rows.length?"مفيش نتائج للبحث ده":"لسه مفيش بيانات. املأ الحقول فوق واضغط «إضافة».")+'</td></tr>';
  $("cnt").textContent=rows.length;
}
function readForm(){var r={},any=false;cols.forEach(function(c,i){var v=$("f"+i).value.trim();r[c]=v;if(v)any=true});return any?r:null}
function clearForm(){cols.forEach(function(c,i){var f=$("f"+i);if(f)f.value=""});editingId=null;$("saveBtn").textContent="إضافة";$("cancelBtn").style.display="none";var f0=$("f0");if(f0)f0.focus()}
function doSave(){
  var r=readForm();if(!r){toast("اكتب بيانات الأول");return}
  if(editingId){var i=idx(editingId);r._id=editingId;if(i>-1)rows[i]=r;queue.push({action:"update",id:editingId,row:r});toast("تم حفظ التعديل")}
  else{r._id=uid();rows.push(r);queue.push({action:"add",id:r._id,row:r});toast("تمت الإضافة")}
  if(!url)queue=[];
  save();clearForm();render();flush();
}
$("saveBtn").onclick=doSave;
$("cancelBtn").onclick=function(){clearForm();render()};
$("q").oninput=render;
$("tbody").onclick=function(e){
  var b=e.target,id;
  if(b.getAttribute("data-e")!==null){
    id=b.getAttribute("data-e");var i=idx(id);if(i<0)return;
    editingId=id;cols.forEach(function(c,k){$("f"+k).value=rows[i][c]||""});
    $("saveBtn").textContent="حفظ التعديل";$("cancelBtn").style.display="";render();window.scrollTo(0,0);
  }else if(b.getAttribute("data-d")!==null){
    id=b.getAttribute("data-d");
    if(confirm("تحذف السجل ده؟")){
      var j=idx(id);if(j>-1)rows.splice(j,1);
      if(url)queue.push({action:"delete",id:id});
      if(editingId===id)clearForm();
      save();render();flush();
    }
  }
};
function requeueAll(){
  if(!url)return;
  queue=[{action:"header"}].concat(rows.map(function(r){return{action:"update",id:r._id,row:r}}));
}
$("colsBtn").onclick=function(){
  var s=prompt("اكتب أسماء الأعمدة مفصولة بفاصلة (،):",cols.join("، "));
  if(s===null)return;
  var n=s.split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean);
  if(!n.length){toast("لازم عمود واحد على الأقل");return}
  var seen={};n=n.filter(function(x){if(seen[x])return false;seen[x]=1;return true});
  var old=cols,same=n.length===old.length;
  rows=rows.map(function(r){var o={_id:r._id};n.forEach(function(c,i){var v=same?r[old[i]]:r[c];o[c]=v==null?"":v});return o});
  cols=n;requeueAll();save();buildForm();clearForm();render();flush();toast("تم تحديث الأعمدة");
};
function conv(v){return(/^(0|[+])/.test(v)||!/^-?\d+(\.\d+)?$/.test(v))?v:Number(v)}
$("xlsBtn").onclick=function(){
  if(!rows.length){toast("مفيش بيانات للتصدير");return}
  var data=rows.map(function(r){var o={};cols.forEach(function(c){o[c]=conv(r[c]==null?"":String(r[c]))});return o});
  var ws=XLSX.utils.json_to_sheet(data,{header:cols});
  ws["!cols"]=cols.map(function(c){return{wch:Math.max(14,c.length+4)}});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"البيانات");
  wb.Workbook={Views:[{RTL:true}]};
  var d=new Date(),p=function(n){return(n<10?"0":"")+n};
  XLSX.writeFile(wb,"بيانات-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".xlsx");
  toast("تم تصدير الملف");
};
$("impBtn").onclick=function(){$("file").click()};
$("file").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(rd.result,{type:"array"});
      var a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      if(a.length<1)throw 0;
      var hdr=a[0].map(function(x){return String(x).trim()});
      var grew=false;
      if(!rows.length)cols=hdr.filter(Boolean);
      else hdr.forEach(function(h){if(h&&cols.indexOf(h)<0){cols.push(h);grew=true}});
      var added=0;
      a.slice(1).forEach(function(line){
        var r={_id:uid()},any=false;cols.forEach(function(c){r[c]=""});
        hdr.forEach(function(h,i){if(h&&line[i]!==""&&line[i]!=null){r[h]=String(line[i]);any=true}});
        if(any){rows.push(r);added++;if(url&&!grew)queue.push({action:"add",id:r._id,row:r})}
      });
      if(url&&grew)requeueAll();
      save();buildForm();clearForm();render();flush();toast("تم استيراد "+added+" سجل");
    }catch(err){toast("الملف مش مقروء — اتأكد إنه ملف Excel")}
    $("file").value="";
  };
  rd.readAsArrayBuffer(f);
};
function openDlg(){$("url").value=url;$("dlg").showModal()}
$("cfgBtn").onclick=openDlg;
$("urlClose").onclick=function(){$("dlg").close()};
$("syncBtn").onclick=function(){if(!url)openDlg();else pull().then(function(){if(!offline&&!queue.length)toast("تمت المزامنة")})};
$("urlOff").onclick=function(){url="";queue=[];offline=false;try{localStorage.removeItem(CFG)}catch(e){}save();setStatus();$("dlg").close();toast("تم فصل الربط")};
$("urlSave").onclick=function(){
  var u=$("url").value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){toast("الرابط لازم يكون رابط /exec من Apps Script");return}
  fetch(u).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw 0;
    var n=rows.length;
    if(n&&!confirm("في "+n+" سجل على الجهاز ده. ترفعهم للشيت؟"))return;
    url=u;try{localStorage.setItem(CFG,u)}catch(e){}
    queue=n?[{action:"header"}].concat(rows.map(function(r){return{action:"add",id:r._id,row:r}})):[];
    $("dlg").close();save();setStatus();
    return pull().then(function(){if(!offline)toast("تم الربط")});
  }).catch(function(){toast("مقدرتش أوصل للرابط. اتأكد إن النشر Anyone وإن الرابط صح")});
};

// كود تشغيل أداة التصوير والذكاء الاصطناعي 
$("scanBtn").onclick = function() { $("scanInput").click(); };
$("scanInput").onchange = function(e) {
  var f = e.target.files[0]; if(!f) return;
  toast("جاري قراءة الورقة بالذكاء الاصطناعي... (ممكن تاخد ثواني)");
  Tesseract.recognize(f, 'ara+eng').then(function(result) {
    var text = result.data.text.trim();
    if(text) {
      // البحث عن خانة الملاحظات (أو أي textarea) ولصق النص بداخلها
      var notesField = document.querySelector('textarea');
      if(notesField) {
        notesField.value += (notesField.value ? "\n" : "") + text;
      }
      toast("تمت قراءة الورقة بنجاح!");
    } else {
      toast("لم يتم العثور على نص واضح في الصورة");
    }
    $("scanInput").value = "";
  }).catch(function(err){
    toast("حصلت مشكلة في قراءة الورقة");
    $("scanInput").value = "";
  });
};

document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
window.addEventListener("online",function(){pull()});
setInterval(function(){if(!document.hidden)pull()},45000);
try{if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())$("xlsBtn").style.display="none"}catch(e){}
load();buildForm();render();setStatus();pull();
})();
</script>
</body>
</html>
