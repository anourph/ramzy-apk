<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrRamzyCRM</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302e;--mute:#5f7773;--line:#d7e2df;--acc:#1f7a6d;--acc2:#16594f;--danger:#b8452f;--field:#f6faf9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b1a;--card:#152826;--ink:#e6f1ef;--mute:#8fa9a5;--line:#244240;--acc:#3fb5a3;--acc2:#2f9686;--danger:#e0705a;--field:#102220;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.6;padding:24px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;margin:0;font-weight:700}
.count{background:var(--acc);color:#fff;border-radius:16px;padding:10px 22px;text-align:center;min-width:120px}
.count b{display:block;font-size:34px;line-height:1.1}
.count span{font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 18px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button.link{border:0;background:none;color:var(--acc);padding:4px 8px}
button.del{color:var(--danger)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input{max-width:280px}
.sp{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:14px;white-space:nowrap}
tr.editing td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.
